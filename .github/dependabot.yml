version: 2
updates:
  # Runtime + dev dependencies. Grouped so a week's worth of minor/patch bumps arrives
  # as one PR that CI validates on the full OS × Node matrix, not fifteen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before it is proposed: most compromised packages are
    # caught and pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Vitest 5 changes the test runner's config and reporters; moving to it is its own
    # change, made deliberately rather than as a Monday bump.
    ignore:
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      # The Node types follow the oldest Node this package supports (engines), so code
      # cannot type-check against an API that version lacks. They move with the floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'

  # The workflows themselves. Actions are pinned to commit SHAs; Dependabot updates the
  # SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci'
