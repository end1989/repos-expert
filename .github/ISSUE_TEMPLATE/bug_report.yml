name: Bug report
description: Something does not work the way the docs say it does.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `expert doctor`
      description: It names your Node version, the model provider in force and the config in use. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: '`expert --version`'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
