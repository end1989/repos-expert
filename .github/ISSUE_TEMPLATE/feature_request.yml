name: Feature request
description: A behaviour you want — a command, an MCP tool, a change to what the curator writes.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where the tool gets in the way.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: The behaviour you want
      description: What you would type or ask, and what should come back.
    validations:
      required: true
