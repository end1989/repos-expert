name: Curator eval

# The real curator on the agent-kit fixture, graded in code (see evals/). It spends model
# tokens, so it runs only when started by hand — after a prompt or model change, before a
# release. Needs an ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Independent trials; a grade passes only if it passes in all of them (pass^k)
        default: '3'
        required: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: run the eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIALS: ${{ inputs.trials }}
        run: npm run eval -- --trials "$TRIALS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report
          path: evals/results/
          if-no-files-found: ignore
