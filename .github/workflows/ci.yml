name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell should not hide the others — a Node-24-only or macOS-only
      # failure is exactly the signal a matrix exists to give.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # 20 is the floor in package.json engines and is past end-of-life (2026-04-30);
        # it stays here for as long as we claim to support it. 22 and 24 are the LTS
        # lines people actually run.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm test` rather than `npx vitest run`: the tarball guard in tests/ packs the
      # package for real and needs npm's execpath in the environment.
      - run: npm test
